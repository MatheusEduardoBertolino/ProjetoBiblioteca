spring.application.name=biblioteca

# ---------------------------------------------------------------
# Banco SQLite pronto, dentro do projeto: backend/data/biblioteca.sqlite
# Ja contem as tabelas e dados das Partes 1 e 2 (triggers e view).
#
# foreign_keys=on : liga as chaves estrangeiras (PRAGMA foreign_keys = ON)
# open_mode=2     : abre o arquivo existente. Se ele nao for encontrado,
#                   a aplicacao avisa com erro em vez de criar um banco vazio.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:sqlite:data/biblioteca.sqlite?foreign_keys=on&open_mode=2
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite aceita um escritor por vez: pool de 1 conexao evita "database is locked"
spring.datasource.hikari.maximum-pool-size=1

# ---------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# As tabelas ja existem no arquivo: o Hibernate nao cria nem altera nada
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
